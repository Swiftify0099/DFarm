name: Secret Scanning (Gitleaks)

on:
  push:
    branches:
      - main
      - fix/cloudflare-pages-production-deploy
      - feature/**
  pull_request:
    branches:
      - main
      - fix/cloudflare-pages-production-deploy

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret & Profile Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install and run Gitleaks
        shell: bash
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --verbose --redact
          rm -f gitleaks gitleaks.tar.gz

      - name: Guard against tracked browser profile or temp artifacts
        shell: bash
        run: |
          if git ls-files | grep -E '(^\.temp/|chrome-cdp|chrome-profile|Default/Network/Cookies|Default/Login Data)'; then
            echo "ERROR: Browser profile or .temp artifact is tracked by Git."
            exit 1
          fi
