<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DFarm — Smart Dairy Operating Platform</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥛</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                DEFAULT: '#00506E',
                50: '#E6F4FA',
                100: '#CFEAFD',
                200: '#9FD4F7',
                300: '#64B8ED',
                400: '#23759B',
                500: '#00506E',
                600: '#00425C',
                700: '#003348',
                800: '#002534',
                900: '#001721',
              },
              dairy: {
                DEFAULT: '#1B5E20',
                50: '#E8F5E9',
                100: '#C8E6C9',
                200: '#A5D6A7',
                300: '#81C784',
                400: '#4CAF50',
                500: '#1B5E20',
                600: '#144618',
                700: '#0E3311',
              },
              clay: {
                bg: '#F4F7FB',
                surface: '#FFFFFF',
                inset: '#EDF2F7',
                border: 'rgba(255, 255, 255, 0.9)',
              }
            },
            boxShadow: {
              'clay-card': '8px 12px 24px -4px rgba(15, 23, 42, 0.06), 2px 4px 8px -2px rgba(15, 23, 42, 0.04), inset 1px 1px 2px 0px rgba(255, 255, 255, 0.95), inset -1px -1px 3px 0px rgba(0, 0, 0, 0.03)',
              'clay-card-hover': '12px 18px 30px -4px rgba(15, 23, 42, 0.09), 4px 6px 12px -2px rgba(15, 23, 42, 0.05), inset 1px 1px 3px 0px rgba(255, 255, 255, 1), inset -1px -1px 4px 0px rgba(0, 0, 0, 0.04)',
              'clay-inset': 'inset 2px 2px 5px rgba(15, 23, 42, 0.06), inset -2px -2px 5px rgba(255, 255, 255, 0.85)',
              'clay-btn': '0 6px 16px -2px rgba(0, 80, 110, 0.35), 0 2px 4px -1px rgba(0, 80, 110, 0.2), inset 0 2px 2px rgba(255, 255, 255, 0.35), inset 0 -2px 4px rgba(0, 0, 0, 0.2)',
              'clay-btn-active': 'inset 0 3px 6px rgba(0, 0, 0, 0.3), 0 1px 2px rgba(0, 80, 110, 0.2)',
              'clay-badge': '0 2px 6px -1px rgba(15, 23, 42, 0.06), inset 0 1px 1px rgba(255, 255, 255, 0.8)',
              'clay-modal': '0 25px 60px -15px rgba(15, 23, 42, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.85) inset, 0 10px 20px -5px rgba(15, 23, 42, 0.08)',
            },
            borderRadius: {
              'clay-sm': '12px',
              'clay': '18px',
              'clay-lg': '24px',
              'clay-xl': '30px',
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #F4F7FB;
      }
      code, pre, .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }

      /* Claymorphism Surface Classes */
      .clay-surface {
        background: #FFFFFF;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.85);
        box-shadow: 8px 12px 24px -4px rgba(15, 23, 42, 0.06), 2px 4px 8px -2px rgba(15, 23, 42, 0.04), inset 1px 1px 2px 0px rgba(255, 255, 255, 0.95), inset -1px -1px 3px 0px rgba(0, 0, 0, 0.03);
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .clay-surface:hover {
        box-shadow: 12px 18px 30px -4px rgba(15, 23, 42, 0.09), 4px 6px 12px -2px rgba(15, 23, 42, 0.05), inset 1px 1px 3px 0px rgba(255, 255, 255, 1), inset -1px -1px 4px 0px rgba(0, 0, 0, 0.04);
      }

      .clay-inset {
        background: #EDF2F7;
        border-radius: 14px;
        border: 1px solid rgba(226, 232, 240, 0.8);
        box-shadow: inset 2px 2px 5px rgba(15, 23, 42, 0.06), inset -2px -2px 5px rgba(255, 255, 255, 0.85);
      }

      .clay-input {
        background: #F1F5F9;
        border-radius: 12px;
        border: 1.5px solid #E2E8F0;
        box-shadow: inset 1.5px 1.5px 4px rgba(15, 23, 42, 0.05), inset -1.5px -1.5px 4px rgba(255, 255, 255, 0.8);
        transition: all 0.15s ease-in-out;
      }
      .clay-input:focus {
        background: #FFFFFF;
        border-color: #00506E;
        box-shadow: inset 1px 1px 3px rgba(0, 80, 110, 0.1), inset -1px -1px 3px rgba(255, 255, 255, 0.9), 0 0 0 3px rgba(0, 80, 110, 0.15);
      }

      .clay-btn-brand {
        background: linear-gradient(135deg, #00688F 0%, #00506E 100%);
        color: #FFFFFF;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 6px 16px -2px rgba(0, 80, 110, 0.35), 0 2px 4px -1px rgba(0, 80, 110, 0.2), inset 0 2px 2px rgba(255, 255, 255, 0.35), inset 0 -2px 4px rgba(0, 0, 0, 0.2);
        transition: all 0.15s ease-out;
      }
      .clay-btn-brand:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 20px -2px rgba(0, 80, 110, 0.45), 0 3px 6px -1px rgba(0, 80, 110, 0.25), inset 0 2px 2px rgba(255, 255, 255, 0.45), inset 0 -2px 4px rgba(0, 0, 0, 0.2);
      }
      .clay-btn-brand:active {
        transform: translateY(1px);
        box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.3), 0 1px 2px rgba(0, 80, 110, 0.2);
      }

      .clay-btn-emerald {
        background: linear-gradient(135deg, #10B981 0%, #059669 100%);
        color: #FFFFFF;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 6px 16px -2px rgba(5, 150, 105, 0.35), 0 2px 4px -1px rgba(5, 150, 105, 0.2), inset 0 2px 2px rgba(255, 255, 255, 0.35), inset 0 -2px 4px rgba(0, 0, 0, 0.2);
        transition: all 0.15s ease-out;
      }
      .clay-btn-emerald:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 20px -2px rgba(5, 150, 105, 0.45), inset 0 2px 2px rgba(255, 255, 255, 0.45), inset 0 -2px 4px rgba(0, 0, 0, 0.2);
      }
      .clay-btn-emerald:active {
        transform: translateY(1px);
        box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.3);
      }

      .clay-btn-secondary {
        background: #FFFFFF;
        color: #1E293B;
        border-radius: 12px;
        border: 1px solid rgba(226, 232, 240, 0.9);
        box-shadow: 0 4px 12px -2px rgba(15, 23, 42, 0.07), inset 0 1.5px 2px rgba(255, 255, 255, 0.95), inset 0 -2px 3px rgba(15, 23, 42, 0.04);
        transition: all 0.15s ease-out;
      }
      .clay-btn-secondary:hover {
        background: #F8FAFC;
        transform: translateY(-1px);
        box-shadow: 0 6px 16px -2px rgba(15, 23, 42, 0.1), inset 0 1.5px 2px rgba(255, 255, 255, 1), inset 0 -2px 3px rgba(15, 23, 42, 0.04);
      }
      .clay-btn-secondary:active {
        transform: translateY(1px);
        box-shadow: inset 0 2px 4px rgba(15, 23, 42, 0.1);
      }

      .clay-card-ambient {
        background: #FFFFFF;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.85);
        box-shadow: 8px 12px 24px -4px rgba(15, 23, 42, 0.06), 2px 4px 8px -2px rgba(15, 23, 42, 0.04), inset 1px 1px 2px 0px rgba(255, 255, 255, 0.95), inset -1px -1px 3px 0px rgba(0, 0, 0, 0.03);
      }

      /* Custom scrollbars */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #F1F5F9;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb {
        background: #CBD5E1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94A3B8;
      }
    </style>
    <script>
      window.process = window.process || { env: { NODE_ENV: 'development' } };
    </script>

      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",

          "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
          "react-dom": "https://esm.sh/react-dom@18.3.1",
          "react-dom/": "https://esm.sh/react-dom@18.3.1/",

          "@dfarm/shared-validation": "/packages/shared-validation/dist/index.js",
          "zod": "https://esm.sh/zod@3.24.1"
        }
      }
    </script>
  </head>
  <body class="bg-[#F4F7FB] text-slate-800 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
