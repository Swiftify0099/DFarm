<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="roseClay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <filter id="failureShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#E11D48" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="-2" stdDeviation="3" flood-color="#FFFFFF" flood-opacity="0.9"/>
    </filter>
  </defs>

  <ellipse cx="100" cy="175" rx="55" ry="10" fill="#0F172A" fill-opacity="0.06"/>

  <!-- Clay Sphere / Badge -->
  <g filter="url(#failureShadow)">
    <circle cx="100" cy="95" r="58" fill="url(#roseClay)" stroke="#FECDD3" stroke-width="4"/>
    <path d="M60,65 A50,50 0 0,1 140,65" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Big 3D Tactile X Mark -->
  <g filter="url(#failureShadow)">
    <path d="M78,73 L122,117" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <path d="M122,73 L78,117" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
