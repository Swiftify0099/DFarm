<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Soft Clay Gradients -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23759B"/>
      <stop offset="100%" stop-color="#00506E"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CFEAFD" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#64B8ED" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="milkDrop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <!-- Shadows -->
    <filter id="clayShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
      <feDropShadow dx="-2" dy="-2" stdDeviation="3" flood-color="#FFFFFF" flood-opacity="0.9"/>
    </filter>
    <filter id="insetBevel" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ambient Base Disc -->
  <ellipse cx="120" cy="165" rx="75" ry="14" fill="#0F172A" fill-opacity="0.05" />

  <!-- 3D Open Ledger / Binder -->
  <g filter="url(#clayShadow)">
    <!-- Left Page -->
    <path d="M45,75 Q85,82 118,72 L118,145 Q85,152 45,145 Z" fill="url(#bookGrad)" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Right Page -->
    <path d="M122,72 Q155,82 195,75 L195,145 Q155,152 122,145 Z" fill="url(#bookGrad)" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Spine -->
    <rect x="116" y="70" width="8" height="78" rx="4" fill="url(#tealGrad)"/>
    <!-- Page Lines Left -->
    <line x1="58" y1="95" x2="105" y2="95" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
    <line x1="58" y1="110" x2="105" y2="110" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
    <line x1="58" y1="125" x2="90" y2="125" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
    <!-- Page Lines Right -->
    <line x1="135" y1="95" x2="182" y2="95" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
    <line x1="135" y1="110" x2="182" y2="110" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
    <line x1="135" y1="125" x2="165" y2="125" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Cute Magnifying Glass -->
  <g filter="url(#clayShadow)" transform="rotate(-15, 140, 95)">
    <circle cx="140" cy="95" r="28" fill="url(#glassGrad)" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="140" cy="95" r="28" stroke="url(#tealGrad)" stroke-width="4"/>
    <rect x="136" y="125" width="8" height="32" rx="4" fill="url(#tealGrad)"/>
    <rect x="138" y="127" width="4" height="28" rx="2" fill="#FFFFFF" fill-opacity="0.3"/>
    <!-- Lens Specular Glint -->
    <path d="M125,82 A20,20 0 0,1 155,82" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 3D Milk Droplet -->
  <g filter="url(#clayShadow)">
    <path d="M78,42 C78,42 62,65 62,75 A16,16 0 0,0 94,75 C94,65 78,42 78,42 Z" fill="url(#milkDrop)" stroke="#BAE6FD" stroke-width="1.5"/>
    <ellipse cx="73" cy="74" rx="4" ry="7" fill="#FFFFFF" opacity="0.8" transform="rotate(-20, 73, 74)"/>
  </g>

  <!-- Sparkles -->
  <circle cx="185" cy="55" r="3" fill="#00506E" opacity="0.6"/>
  <circle cx="48" cy="60" r="2.5" fill="#10B981" opacity="0.7"/>
  <circle cx="195" cy="115" r="2" fill="#FF8F00" opacity="0.8"/>
</svg>
