<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="emeraldClay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="shieldWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="successShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#059669" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="-2" stdDeviation="3" flood-color="#FFFFFF" flood-opacity="0.9"/>
    </filter>
  </defs>

  <ellipse cx="100" cy="175" rx="55" ry="10" fill="#0F172A" fill-opacity="0.06"/>

  <!-- Clay Sphere / Badge -->
  <g filter="url(#successShadow)">
    <circle cx="100" cy="95" r="58" fill="url(#emeraldClay)" stroke="#A7F3D0" stroke-width="4"/>
    <!-- Specular Highlight Bevel -->
    <path d="M60,65 A50,50 0 0,1 140,65" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Big 3D Tactile Checkmark -->
  <g filter="url(#successShadow)">
    <path d="M72,98 L92,118 L132,74" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Floating Coins -->
  <circle cx="45" cy="55" r="10" fill="#FBBF24" stroke="#FDE68A" stroke-width="2"/>
  <circle cx="160" cy="65" r="8" fill="#FBBF24" stroke="#FDE68A" stroke-width="2"/>
</svg>
