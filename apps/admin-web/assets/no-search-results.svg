<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="lensBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="tealHandle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23759B"/>
      <stop offset="100%" stop-color="#00506E"/>
    </linearGradient>
    <filter id="glassShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.1"/>
      <feDropShadow dx="-2" dy="-2" stdDeviation="3" flood-color="#FFFFFF" flood-opacity="0.9"/>
    </filter>
  </defs>

  <ellipse cx="100" cy="170" rx="60" ry="12" fill="#0F172A" fill-opacity="0.05"/>

  <!-- Clay Magnifier -->
  <g filter="url(#glassShadow)">
    <circle cx="90" cy="85" r="45" fill="url(#lensBg)" stroke="#CBD5E1" stroke-width="4"/>
    <circle cx="90" cy="85" r="35" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <!-- Specular Highlight -->
    <path d="M65,65 A30,30 0 0,1 115,65" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Handle -->
    <rect x="120" y="115" width="16" height="50" rx="8" transform="rotate(-45, 120, 115)" fill="url(#tealHandle)"/>
    <rect x="123" y="117" width="8" height="46" rx="4" transform="rotate(-45, 120, 115)" fill="#FFFFFF" opacity="0.3"/>
  </g>

  <!-- Question Mark or Soft Sad Line -->
  <path d="M78,85 Q90,75 102,85" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="78" cy="74" r="3" fill="#64748B"/>
  <circle cx="102" cy="74" r="3" fill="#64748B"/>
</svg>
