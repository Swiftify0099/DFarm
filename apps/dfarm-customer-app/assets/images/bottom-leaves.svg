<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 90" width="100" height="90" fill="none">
  <defs>
    <linearGradient id="leafGradDeep" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B5E20" />
      <stop offset="100%" stop-color="#43A047" />
    </linearGradient>
    <linearGradient id="leafGradVibrant" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E7D32" />
      <stop offset="100%" stop-color="#66BB6A" />
    </linearGradient>
    <linearGradient id="leafGradSoft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388E3C" />
      <stop offset="100%" stop-color="#81C784" />
    </linearGradient>
    <linearGradient id="leafGradSprout" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#A5D6A7" />
    </linearGradient>
  </defs>

  <!-- Central Stem Branch -->
  <path
    d="M100 90 Q75 68 45 40"
    stroke="#2E7D32"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <!-- Top-Most Pointed Leaf -->
  <path
    d="M45 40 C30 32 20 16 22 5 C35 6 46 24 45 40 Z"
    fill="url(#leafGradVibrant)"
  />
  <path
    d="M42 35 C36 28 32 20 30 13"
    stroke="#A5D6A7"
    stroke-width="1.5"
    stroke-linecap="round"
    opacity="0.9"
  />

  <!-- Upper-Left Outward Leaf -->
  <path
    d="M62 58 C44 52 34 38 34 28 C48 28 60 44 62 58 Z"
    fill="url(#leafGradSoft)"
  />
  <path
    d="M58 52 C50 44 45 38 42 32"
    stroke="#C8E6C9"
    stroke-width="1.4"
    stroke-linecap="round"
    opacity="0.9"
  />

  <!-- Mid-Right Upward Leaf -->
  <path
    d="M68 54 C68 36 78 22 92 16 C95 32 84 48 68 54 Z"
    fill="url(#leafGradDeep)"
  />
  <path
    d="M72 48 C77 38 84 28 89 22"
    stroke="#81C784"
    stroke-width="1.4"
    stroke-linecap="round"
    opacity="0.9"
  />

  <!-- Lower Left Sprout Leaf -->
  <path
    d="M80 74 C66 72 56 64 54 56 C64 55 75 64 80 74 Z"
    fill="url(#leafGradSprout)"
  />
  <path
    d="M76 70 C70 66 65 62 62 59"
    stroke="#E8F5E9"
    stroke-width="1.2"
    stroke-linecap="round"
    opacity="0.8"
  />
</svg>
