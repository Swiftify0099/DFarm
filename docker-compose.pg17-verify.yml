# Isolated, disposable PostgreSQL 17 instance for RESTART-03 / DFarm verification tests.
# Usage:
#   docker compose -f docker-compose.pg17-verify.yml up -d --wait
#   $env:TEST_POSTGRES_URL="postgresql://dfarm_verify:dfarm_verify_local@127.0.0.1:55432/dfarm_central"
#   node --test services/backend/tests/restart03-real-postgres.test.js
#   docker compose -f docker-compose.pg17-verify.yml down -v

services:
  postgres17:
    image: postgres:17-alpine
    container_name: dfarm-pg17-verify
    environment:
      POSTGRES_USER: dfarm_verify
      POSTGRES_PASSWORD: dfarm_verify_local
      POSTGRES_DB: dfarm_central
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dfarm_verify -d dfarm_central"]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
