# Isolated, disposable PostgreSQL 17 instance for RESTART-03 / DFarm verification tests.
# Usage:
#   docker compose -f docker-compose.pg17-verify.yml up -d --wait
#   $env:NODE_ENV="test"
#   $env:DFARM_ALLOW_DISPOSABLE_PG17_MUTATIONS="1"
#   $env:REQUIRE_REAL_POSTGRES="1"
#   $env:TEST_REAL_POSTGRES="1"
#   $env:TEST_POSTGRES_URL="postgresql://postgres:placeholder_ci_pg17_test_password@127.0.0.1:55432/dfarm_central"
#   node scripts/ci-pg17-bootstrap.js
#   node scripts/ci-run-pg17-suites.js
#   docker compose -f docker-compose.pg17-verify.yml down -v

services:
  postgres17:
    image: postgres:17-alpine
    container_name: dfarm-pg17-verify
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: placeholder_ci_pg17_test_password
      POSTGRES_DB: dfarm_central
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dfarm_central"]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
