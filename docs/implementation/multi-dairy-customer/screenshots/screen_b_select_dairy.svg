<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" fill="none">
  <!-- Background -->
  <rect width="375" height="812" fill="#F4F8F3"/>
  
  <!-- Status Bar -->
  <text x="32" y="38" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1C2A1E">9:41</text>
  
  <!-- Header -->
  <g transform="translate(24, 60)">
    <text x="0" y="24" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#1C2A1E">तुमची डेअरी खाती निवडा</text>
    <text x="0" y="48" font-family="system-ui, sans-serif" font-size="13" fill="#4D6352">एकाच मोबाईल नंबरवर उपलब्ध असलेली तुमची मंजूर खाती</text>
  </g>
  
  <!-- Membership Card 1: Warna Dairy (Approved) -->
  <g transform="translate(24, 136)">
    <rect width="327" height="136" rx="20" fill="#FFFFFF" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.06))"/>
    <rect x="0.5" y="0.5" width="326" height="135" rx="19.5" stroke="#C8E6C9" stroke-width="1.5"/>
    
    <!-- Status Badge -->
    <rect x="220" y="16" width="91" height="24" rx="12" fill="#E8F5E9"/>
    <text x="265" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1B5E20">✓ मंजूर खाते</text>
    
    <text x="18" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1C2A1E">वारणा सहकारी दूध संस्था</text>
    <text x="18" y="54" font-family="system-ui, sans-serif" font-size="12" fill="#829787">कोड: WARNA-01 • वारणा नगर</text>
    
    <!-- Details Row -->
    <rect x="18" y="74" width="130" height="32" rx="10" fill="#F4F8F3"/>
    <text x="26" y="94" font-family="system-ui, sans-serif" font-size="11" fill="#4D6352">शेतकरी कोड: <tspan font-weight="700" fill="#1B5E20">C-W101</tspan></text>
    
    <rect x="156" y="74" width="110" height="32" rx="10" fill="#F4F8F3"/>
    <text x="164" y="94" font-family="system-ui, sans-serif" font-size="11" fill="#4D6352">केंद्र: मुख्य संकलन</text>
    
    <!-- Action Arrow Circle -->
    <circle cx="295" cy="90" r="18" fill="#1B5E20"/>
    <path d="M292 84L298 90L292 96" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Membership Card 2: Krishna Valley Dairy (Approved) -->
  <g transform="translate(24, 292)">
    <rect width="327" height="136" rx="20" fill="#FFFFFF" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.06))"/>
    <rect x="0.5" y="0.5" width="326" height="135" rx="19.5" stroke="#E0E8E1"/>
    
    <!-- Status Badge -->
    <rect x="220" y="16" width="91" height="24" rx="12" fill="#E8F5E9"/>
    <text x="265" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1B5E20">✓ मंजूर खाते</text>
    
    <text x="18" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1C2A1E">कृष्णा व्हॅली दूध संघ</text>
    <text x="18" y="54" font-family="system-ui, sans-serif" font-size="12" fill="#829787">कोड: KRISHNA-02 • सांगली</text>
    
    <!-- Details Row -->
    <rect x="18" y="74" width="130" height="32" rx="10" fill="#F4F8F3"/>
    <text x="26" y="94" font-family="system-ui, sans-serif" font-size="11" fill="#4D6352">शेतकरी कोड: <tspan font-weight="700" fill="#1B5E20">C-K204</tspan></text>
    
    <rect x="156" y="74" width="110" height="32" rx="10" fill="#F4F8F3"/>
    <text x="164" y="94" font-family="system-ui, sans-serif" font-size="11" fill="#4D6352">केंद्र: उत्तर केंद्र</text>
    
    <!-- Action Arrow Circle -->
    <circle cx="295" cy="90" r="18" fill="#1B5E20"/>
    <path d="M292 84L298 90L292 96" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Membership Card 3: Gokul Dairy (Pending) -->
  <g transform="translate(24, 448)">
    <rect width="327" height="110" rx="20" fill="#FFFFFF" opacity="0.9" filter="drop-shadow(0px 6px 12px rgba(0,0,0,0.04))"/>
    <rect x="0.5" y="0.5" width="326" height="109" rx="19.5" stroke="#FFE082"/>
    
    <!-- Warning Badge -->
    <rect x="195" y="16" width="116" height="24" rx="12" fill="#FFF8E1"/>
    <text x="253" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#D48B14">⏳ मंजुरी प्रलंबित</text>
    
    <text x="18" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1C2A1E">गोकुळ सहकारी संघ</text>
    <text x="18" y="54" font-family="system-ui, sans-serif" font-size="12" fill="#829787">कोड: GOKUL-05 • कोल्हापूर</text>
    <text x="18" y="85" font-family="system-ui, sans-serif" font-size="12" fill="#D48B14">डेअरी ॲडमिन पडताळणी प्रगतीपथावर आहे</text>
  </g>
  
  <!-- Add New Dairy Button -->
  <g transform="translate(24, 600)">
    <rect width="327" height="56" rx="16" fill="#FFFFFF" stroke="#1B5E20" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="163" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1B5E20">+ दुसऱ्या नवीन डेअरीसाठी अर्ज करा</text>
  </g>
