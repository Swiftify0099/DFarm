    <rect x="0" y="0" width="46" height="54" rx="12" fill="#FFFFFF" stroke="#1B5E20" stroke-width="2" filter="drop-shadow(0px 4px 8px rgba(27,94,32,0.12))"/>
    <text x="23" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#1B5E20">7</text>
    
    <!-- Box 2 -->
    <rect x="56" y="0" width="46" height="54" rx="12" fill="#FFFFFF" stroke="#1B5E20" stroke-width="2"/>
    <text x="79" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#1B5E20">2</text>
    
    <!-- Box 3 -->
    <rect x="112" y="0" width="46" height="54" rx="12" fill="#FFFFFF" stroke="#1B5E20" stroke-width="2"/>
    <text x="135" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#1B5E20">3</text>
    
    <!-- Box 4 -->
    <rect x="168" y="0" width="46" height="54" rx="12" fill="#FFFFFF" stroke="#1B5E20" stroke-width="2"/>
    <text x="191" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#1B5E20">8</text>
    
    <!-- Box 5 -->
    <rect x="224" y="0" width="46" height="54" rx="12" fill="#FFFFFF" stroke="#1B5E20" stroke-width="2"/>
    <text x="247" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#1B5E20">0</text>
    
    <!-- Box 6 -->
    <rect x="280" y="0" width="46" height="54" rx="12" fill="#FFFFFF" stroke="#1B5E20" stroke-width="2"/>
    <text x="303" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#1B5E20">6</text>
  </g>
  
  <!-- Resend Timer -->
  <text x="187" y="470" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#829787">ओटीपी आला नाही? पुन्हा पाठवा (४२ सेकंद)</text>
  
  <!-- Submit Button -->
  <g transform="translate(24, 510)">
    <rect width="327" height="56" rx="16" fill="#1B5E20" filter="drop-shadow(0px 8px 16px rgba(27,94,32,0.3))"/>
