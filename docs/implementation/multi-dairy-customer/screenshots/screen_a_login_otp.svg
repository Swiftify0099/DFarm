<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" fill="none">
  <!-- Background -->
  <rect width="375" height="812" fill="#F4F8F3"/>
  
  <!-- Status Bar -->
  <text x="32" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1C2A1E">9:41</text>
  <circle cx="340" cy="34" r="3" fill="#1C2A1E"/>
  
  <!-- Header / Logo -->
  <g transform="translate(147, 80)">
    <rect width="80" height="80" rx="24" fill="#1B5E20" filter="drop-shadow(0px 8px 16px rgba(27,94,32,0.25))"/>
    <path d="M40 22C32 22 26 28 26 36C26 48 40 58 40 58C40 58 54 48 54 36C54 28 48 22 40 22Z" fill="#FFFFFF"/>
    <circle cx="40" cy="36" r="6" fill="#D48B14"/>
  </g>
  
  <text x="187" y="195" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#1C2A1E">डी-फार्म शेतकरी लॉगिन</text>
  <text x="187" y="222" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#4D6352">तुमचा पडताळणी केलेला १०-अंकी मोबाईल नंबर टाका</text>
  
  <!-- Phone Card -->
  <g transform="translate(24, 256)">
    <rect width="327" height="64" rx="18" fill="#FFFFFF" filter="drop-shadow(0px 6px 12px rgba(0,0,0,0.06))"/>
    <rect x="0.5" y="0.5" width="326" height="63" rx="17.5" stroke="#E0E8E1"/>
    <rect x="16" y="16" width="54" height="32" rx="10" fill="#F4F8F3"/>
    <text x="43" y="37" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#1B5E20">+91</text>
    <text x="86" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1C2A1E">98765 43210</text>
  </g>
  
  <!-- OTP Section -->
  <text x="28" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1C2A1E">६-अंकी ओटीपी प्रविष्ट करा</text>
  
  <!-- 6 OTP Boxes -->
  <g transform="translate(24, 380)">
