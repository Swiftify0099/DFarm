  </g>
  
  <!-- Security Badge -->
  <g transform="translate(70, 720)">
    <rect width="235" height="32" rx="16" fill="#E8F5E9"/>
    <text x="117" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1B5E20">🔒 शासकीय नियमांनुसार १००% सुरक्षित लॉगिन</text>
  </g>
