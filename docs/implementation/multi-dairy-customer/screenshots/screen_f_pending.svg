<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" fill="none">
  <!-- Background -->
  <rect width="375" height="812" fill="#F4F8F3"/>
  <text x="32" y="38" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1C2A1E">9:41</text>
  
  <!-- Status Illustration -->
  <g transform="translate(147, 100)">
    <circle cx="40" cy="40" r="40" fill="#FFF8E1" filter="drop-shadow(0px 8px 16px rgba(212,139,20,0.2))"/>
    <circle cx="40" cy="40" r="30" fill="#FFE082"/>
    <text x="40" y="48" text-anchor="middle" font-size="28">⏳</text>
  </g>
  
  <text x="187" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#1C2A1E">नोंदणी अर्ज प्राप्त झाला आहे</text>
  <text x="187" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#4D6352">राजारामबापू पाटील दूध संघ • अर्ज आयडी: APP-8291</text>
  
  <!-- Progress Stepper Card -->
  <g transform="translate(24, 270)">
    <rect width="327" height="230" rx="20" fill="#FFFFFF" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.06))"/>
    
    <!-- Step 1 (Completed) -->
    <circle cx="36" cy="46" r="14" fill="#1B5E20"/>
    <text x="36" y="51" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">✓</text>
    <text x="64" y="42" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1C2A1E">नोंदणी अर्ज यशस्वीरीत्या सादर</text>
    <text x="64" y="58" font-family="system-ui, sans-serif" font-size="11" fill="#829787">१९ नोव्हेंबर, सकाळी ९:४०</text>
    
    <!-- Connector Line 1 -->
    <line x1="36" y1="60" x2="36" y2="106" stroke="#1B5E20" stroke-width="2"/>
    
    <!-- Step 2 (In Progress) -->
    <circle cx="36" cy="120" r="14" fill="#FFF8E1" stroke="#D48B14" stroke-width="2"/>
    <circle cx="36" cy="120" r="5" fill="#D48B14"/>
    <text x="64" y="116" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#D48B14">डेअरी ॲडमिन पडताळणी (प्रगतीपथावर)</text>
    <text x="64" y="132" font-family="system-ui, sans-serif" font-size="11" fill="#4D6352">कागदपत्रे आणि गाव कार्यक्षेत्र पडताळणी सुरू आहे</text>
    
    <!-- Connector Line 2 -->
    <line x1="36" y1="134" x2="36" y2="176" stroke="#E0E8E1" stroke-width="2" stroke-dasharray="3 3"/>
    
    <!-- Step 3 (Pending) -->
    <circle cx="36" cy="190" r="14" fill="#F4F8F3" stroke="#C5D3C7" stroke-width="1.5"/>
    <text x="64" y="186" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#829787">शेतकरी कोड वाटप व खाते सक्रिय</text>
    <text x="64" y="202" font-family="system-ui, sans-serif" font-size="11" fill="#829787">मंजुरीनंतर SMS द्वारे कळवले जाईल</text>
  </g>
  
  <!-- Info Box -->
  <g transform="translate(24, 524)">
    <rect width="327" height="60" rx="16" fill="#E8F5E9"/>
    <text x="16" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1B5E20">💡 तुमचे इतर चालू डेअरी खाती पूर्ववत सुरू आहेत.</text>
    <text x="16" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#4D6352">या नवीन अर्जामुळे जुन्या वारणा डेअरीवर कोणताही परिणाम होणार नाही.</text>
  </g>
  
  <!-- Navigation Buttons -->
  <g transform="translate(24, 610)">
    <rect width="327" height="54" rx="16" fill="#1B5E20" filter="drop-shadow(0px 6px 14px rgba(27,94,32,0.25))"/>
    <text x="163" y="33" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">माझी सर्व डेअरी खाती पहा</text>
  </g>
</svg>
